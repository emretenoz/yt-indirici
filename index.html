<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT İndirici</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1c1c1c; --muted: #6b6b6b; --line: #e3e3df;
    --accent: #d93025; --accent-text: #fff; --ok: #1e8e3e; --err: #c5221f; --soft: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1e1e1e; --text: #ececec; --muted: #9a9a9a; --line: #333;
      --accent: #f2564b; --accent-text: #fff; --ok: #5bb974; --err: #f28b82; --soft: #262626;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
           background: var(--accent); color: var(--accent-text); white-space: nowrap; }
  button.ghost { background: var(--soft); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: flex; background: var(--soft); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); font-weight: 500; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .grid { display: grid; gap: 16px; }
  .meta { display: flex; gap: 14px; align-items: center; }
  .meta img { width: 120px; border-radius: 8px; flex-shrink: 0; }
  .meta .t { font-weight: 600; }
  .meta .c { color: var(--muted); font-size: 13px; }
  .player { aspect-ratio: 16/9; width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
  .player iframe, .player > div { width: 100%; height: 100%; border: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .status { font-size: 14px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .hidden { display: none !important; }
  a.dl { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 8px; background: var(--ok);
         color: #fff; text-decoration: none; font-weight: 600; }
  @media (max-width: 520px) { .row.wrap { flex-direction: column; } .meta img { width: 88px; } }
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <h1>YT İndirici</h1>
    <button id="quit" class="ghost" title="Uygulamayı arka planda kapatır">Uygulamayı kapat</button>
  </div>
  <p class="sub">YouTube videosunu MP3 veya MP4 olarak indir — tamamını ya da istediğin bir kısmını.</p>

  <div class="card">
    <label for="url">YouTube bağlantısı</label>
    <div class="row">
      <input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button id="fetch" style="flex:0 0 auto">Getir</button>
    </div>
    <div id="fetchStatus" class="status hint"></div>
  </div>

  <div id="opts" class="card grid hidden">
    <div class="meta">
      <img id="thumb" alt="">
      <div><div class="t" id="title"></div><div class="c" id="channel"></div></div>
    </div>

    <div class="player"><div id="player"></div></div>

    <div>
      <label>Biçim</label>
      <div class="seg" id="fmt">
        <button data-v="mp4" class="on">MP4 (video)</button>
        <button data-v="mp3">MP3 (ses)</button>
      </div>
    </div>

    <div>
      <label for="quality">Kalite</label>
      <select id="quality"></select>
    </div>

    <div>
      <label>Kısım</label>
      <div class="seg" id="range">
        <button data-v="full" class="on">Tamamı</button>
        <button data-v="part">Belirli kısım</button>
      </div>
    </div>

    <div id="partBox" class="hidden">
      <div class="row wrap">
        <div>
          <label for="start">Başlangıç</label>
          <div class="row"><input id="start" placeholder="0:00"><button class="ghost" data-set="start" style="flex:0 0 auto">Şu an</button></div>
        </div>
        <div>
          <label for="end">Bitiş</label>
          <div class="row"><input id="end" placeholder="0:10"><button class="ghost" data-set="end" style="flex:0 0 auto">Şu an</button></div>
        </div>
      </div>
      <div class="hint">Örnek: <b>1:23</b>, <b>83</b> veya <b>1:02:03</b>. Videoyu yukarıda oynatıp “Şu an”a basarak da seçebilirsin.</div>
    </div>

    <button id="go">İndir</button>

    <div id="progress" class="hidden">
      <div class="bar"><div id="barFill"></div></div>
      <div id="dlStatus" class="status"></div>
      <a id="dlLink" class="dl hidden" href="#">Dosyayı kaydet</a>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let fmt = "mp4", range = "full", info = null, player = null, polling = null;

const fmtTime = s => {
  s = Math.max(0, Math.round(s * 10) / 10);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = (s % 60);
  const ss = (sec < 10 ? "0" : "") + (Number.isInteger(sec) ? sec : sec.toFixed(1));
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
};

function videoId(u) {
  const m = u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function seg(el, cb) {
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    cb(b.dataset.v);
  });
}

function fillQuality() {
  const q = $("quality");
  q.innerHTML = "";
  const opts = fmt === "mp3"
    ? [["320", "320 kbps (en iyi)"], ["192", "192 kbps"], ["128", "128 kbps (küçük dosya)"]]
    : [["best", "En iyi"], ...[2160, 1440, 1080, 720, 480, 360].filter(h => !info || info.heights.some(x => x >= h)).map(h => [String(h), h + "p"])];
  opts.forEach(([v, t]) => q.add(new Option(t, v)));
  if (fmt === "mp3") q.value = "192";
}

seg($("fmt"), v => { fmt = v; fillQuality(); });
seg($("range"), v => { range = v; $("partBox").classList.toggle("hidden", v !== "part"); });

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "Hata");
  return j;
}

// YouTube oynatıcı (saniye seçmek için)
let ytReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });
const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);

async function loadPlayer(id) {
  try {
    await Promise.race([ytReady, new Promise((_, rej) => setTimeout(rej, 5000))]);
    if (player) { player.cueVideoById(id); return; }
    player = new YT.Player("player", { videoId: id, playerVars: { rel: 0, modestbranding: 1 } });
  } catch { $("player").outerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`; }
}

document.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", () => {
  if (player && player.getCurrentTime) $(b.dataset.set).value = fmtTime(player.getCurrentTime());
}));

$("fetch").addEventListener("click", async () => {
  const url = $("url").value.trim(); if (!url) return;
  $("fetch").disabled = true; $("fetchStatus").className = "status hint"; $("fetchStatus").textContent = "Video bilgisi alınıyor…";
  try {
    info = await api("/api/info", { url });
    $("title").textContent = info.title; $("channel").textContent = `${info.channel || ""} · ${fmtTime(info.duration || 0)}`;
    $("thumb").src = info.thumbnail || "";
    $("end").placeholder = fmtTime(info.duration || 10);
    fillQuality();
    $("opts").classList.remove("hidden"); $("progress").classList.add("hidden");
    $("fetchStatus").textContent = "";
    const id = videoId(url); if (id) loadPlayer(id);
  } catch (e) { $("fetchStatus").className = "status err"; $("fetchStatus").textContent = e.message; }
  $("fetch").disabled = false;
});
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("fetch").click(); });
$("url").addEventListener("paste", () => setTimeout(() => $("fetch").click(), 50));

$("go").addEventListener("click", async () => {
  const body = { url: $("url").value.trim(), format: fmt, quality: $("quality").value };
  if (range === "part") { body.start = $("start").value; body.end = $("end").value; }
  $("go").disabled = true; $("progress").classList.remove("hidden"); $("dlLink").classList.add("hidden");
  $("barFill").style.width = "0"; setStatus("Başlatılıyor…");
  try {
    const { job } = await api("/api/download", body);
    clearInterval(polling);
    polling = setInterval(() => poll(job), 700);
  } catch (e) { setStatus(e.message, "err"); $("go").disabled = false; }
});

$("quit").addEventListener("click", async () => {
  if (!confirm("Uygulama kapatılsın mı? Tekrar açmak için YT İndirici'ye çift tıklaman yeterli.")) return;
  try { await fetch("/api/quit", { method: "POST", body: "{}" }); } catch {}
  document.querySelector("main").innerHTML = "<h1>YT İndirici kapatıldı</h1><p class='sub'>Bu sekmeyi kapatabilirsin. Tekrar açmak için YT İndirici'ye çift tıkla.</p>";
});

function setStatus(t, cls = "") { $("dlStatus").className = "status " + cls; $("dlStatus").textContent = t; }

async function poll(job) {
  const j = await (await fetch("/api/job/" + job)).json();
  if (j.percent != null) $("barFill").style.width = j.percent + "%";
  if (j.status === "downloading") setStatus(`İndiriliyor… ${j.percent != null ? Math.round(j.percent) + "%" : ""} ${j.speed ? "· " + j.speed : ""} ${j.eta ? "· kalan " + j.eta : ""}`);
  else if (j.status === "processing") setStatus("Dönüştürülüyor / kesiliyor…");
  else if (j.status === "done") {
    clearInterval(polling); $("go").disabled = false;
    setStatus("Hazır: " + j.filename, "ok");
    const a = $("dlLink"); a.href = "/file/" + job; a.classList.remove("hidden");
    a.click();
  } else if (j.status === "error") { clearInterval(polling); $("go").disabled = false; setStatus(j.error, "err"); }
}
</script>
</body>
</html>
